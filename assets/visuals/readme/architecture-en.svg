<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Russia 2050 static platform workflow</title>
  <desc id="desc">A vertical workflow from source data through local ETL, static pages, interactive modules and QA checks.</desc>
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto">
      <path d="M1 1 L12 6.5 L1 12 Z" fill="#0f5961"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#0d2f35}
      .title{font-size:32px;font-weight:800}
      .sub{font-size:22px;font-weight:600}
      .box{fill:#fffaf0;stroke:#d6a332;stroke-width:3;rx:18}
      .boxAlt{fill:#edf8f8;stroke:#0f5961;stroke-width:3;rx:18}
      .num{font-size:24px;font-weight:900;fill:#a06c00}
      .label{font-size:25px;font-weight:900}
      .line{font-size:22px;font-weight:600}
      .arrow{stroke:#0f5961;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .note{fill:#0a383d}
      .noteText{fill:#fffaf0;font-size:21px;font-weight:700}
    </style>
  </defs>
  <rect width="900" height="900" fill="#f7f1e4"/>
  <text x="70" y="58" class="title">Russia 2050 platform workflow</text>
  <text x="70" y="92" class="sub">Local preparation feeds a static GitHub Pages app.</text>

  <rect x="90" y="130" width="720" height="112" class="box"/>
  <text x="122" y="172" class="num">1</text>
  <text x="172" y="172" class="label">Source layers</text>
  <text x="172" y="205" class="line">TFR, population, RPN, VCIOM, OSM,</text>
  <text x="172" y="232" class="line">family, abortions and policy inputs.</text>

  <path class="arrow" d="M450 252 V292"/>

  <rect x="90" y="302" width="720" height="112" class="boxAlt"/>
  <text x="122" y="344" class="num">2</text>
  <text x="172" y="344" class="label">Local data build</text>
  <text x="172" y="377" class="line">Python scripts create JSON, CSV and SQLite</text>
  <text x="172" y="404" class="line">layers with a 2050 calculation horizon.</text>

  <path class="arrow" d="M450 424 V464"/>

  <rect x="90" y="474" width="720" height="112" class="box"/>
  <text x="122" y="516" class="num">3</text>
  <text x="172" y="516" class="label">Static browser app</text>
  <text x="172" y="549" class="line">docs/*.html reads only local data, local</text>
  <text x="172" y="576" class="line">Plotly, local Three.js and bundled assets.</text>

  <path class="arrow" d="M450 596 V636"/>

  <rect x="90" y="646" width="720" height="112" class="boxAlt"/>
  <text x="122" y="688" class="num">4</text>
  <text x="172" y="688" class="label">Interactive scenarios</text>
  <text x="172" y="721" class="line">Controls recalculate KPI, maps, charts,</text>
  <text x="172" y="748" class="line">tables and exports across all modules.</text>

  <rect x="90" y="796" width="720" height="82" rx="16" class="note"/>
  <text x="118" y="828" class="noteText">Release checks cover data validity, local-only loading,</text>
  <text x="118" y="856" class="noteText">Russian UI and Playwright interaction tests.</text>
</svg>
